name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'apps/server/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'apps/server/**'
      - 'packages/**'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Type check backend
      run: bun run --filter vext-backend build
      continue-on-error: true

    - name: Type check server
      run: bun run --filter vext-ws-server build
      continue-on-error: true

    - name: Verify backend starts
      run: |
        timeout 10 bun run --filter vext-backend start || true
      env:
        MONGODB_URI: mongodb://localhost:27017/vext_test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: ci-test-secret-do-not-use-in-production
        PORT: 3001

    - name: Verify server starts
      run: |
        timeout 10 bun run --filter vext-ws-server start || true
      env:
        MONGODB_URI: mongodb://localhost:27017/vext_test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: ci-test-secret-do-not-use-in-production
        PORT: 3002

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Build backend Docker image
      run: docker build -f apps/backend/Dockerfile -t vext-backend .

    - name: Build server Docker image
      run: docker build -f apps/server/Dockerfile -t vext-server .
