name: Build Tauri App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: apps/frontend/src-tauri

    - name: Install dependencies
      run: bun install

    - name: Build Tauri App
      working-directory: ./apps/frontend
      run: bun run tauri build
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://hoopslive.ch/vext' }}
        VITE_WEBSOCKET_URL: ${{ secrets.VITE_WEBSOCKET_URL || 'wss://hoopslive.ch/vext' }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VEXT-Windows-Setup
        retention-days: 7
        path: |
          apps/frontend/src-tauri/target/release/bundle/nsis/*.exe
          apps/frontend/src-tauri/target/release/bundle/msi/*.msi
          apps/frontend/src-tauri/target/release/*.exe
        if-no-files-found: warn
