name: Build Tauri App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./apps/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: apps/frontend/src-tauri

    - name: Install dependencies
      run: bun install
      working-directory: .

    - name: Run tests
      run: bun run test --run
      continue-on-error: true

    - name: Build Tauri App
      run: bun run tauri build
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://vext-backend.onrender.com' }}
        VITE_WEBSOCKET_URL: ${{ secrets.VITE_WEBSOCKET_URL || 'wss://vext-ws-server.onrender.com' }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VEXT-Windows-Setup
        retention-days: 7
        path: apps/frontend/src-tauri/target/release/bundle/nsis/*.exe
        if-no-files-found: warn
