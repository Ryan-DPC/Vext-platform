name: Release VEXT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: apps/frontend/src-tauri

    - name: Install dependencies
      run: bun install

    - name: Build Tauri App
      working-directory: ./apps/frontend
      run: bun run tauri build
      env:
        VITE_API_URL: 'https://hoopslive.ch/vext'
        VITE_WEBSOCKET_URL: 'wss://hoopslive.ch/vext'
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    - name: Generate Auto-Updater Metadata (latest.json)
      shell: pwsh
      run: |
        $v = (Get-Content apps/frontend/src-tauri/tauri.conf.json | ConvertFrom-Json).version
        $tag = if ("${{ github.ref_name }}" -match "^v") { "${{ github.ref_name }}" } else { "v$v" }
        $exe = Get-ChildItem "apps/frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
        if (-not $exe) { Write-Error "Aucun installeur NSIS produit"; exit 1 }

        $sig = ""
        $sigPath = "$($exe.FullName).sig"
        if (Test-Path $sigPath) {
          $sig = (Get-Content $sigPath | Select-Object -Last 1).Trim()
        } else {
          $zipSig = Get-ChildItem "apps/frontend/src-tauri/target/release/bundle/nsis/*.zip.sig" | Select-Object -First 1
          if ($zipSig) { $sig = (Get-Content $zipSig.FullName | Select-Object -Last 1).Trim() }
        }

        Write-Host "Création de latest.json pour la version $v (Tag: $tag)"

        $latest = @{
            version = $v
            notes = "Mise à jour VEXT $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
                "windows-x86_64" = @{
                    signature = $sig
                    url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
                }
            }
        }
        $latest | ConvertTo-Json -Depth 10 | Set-Content "apps/frontend/src-tauri/target/release/latest.json" -Encoding utf8

    - name: Publish update to VPS (updater endpoint)
      shell: pwsh
      env:
        VEXT_UPDATE_TOKEN: ${{ secrets.VEXT_UPDATE_TOKEN }}
      run: |
        if (-not $env:VEXT_UPDATE_TOKEN) { Write-Error "Secret VEXT_UPDATE_TOKEN manquant"; exit 1 }
        $v = (Get-Content apps/frontend/src-tauri/tauri.conf.json | ConvertFrom-Json).version
        $exe = Get-ChildItem "apps/frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
        $sigFile = "$($exe.FullName).sig"
        if (-not (Test-Path $sigFile)) { Write-Error "Signature .sig introuvable"; exit 1 }
        $sig = (Get-Content $sigFile -Raw).Trim()
        curl.exe --fail --show-error -sS -X POST "https://hoopslive.ch/vext/api/updates/publish" `
          -H "x-update-token: $env:VEXT_UPDATE_TOKEN" `
          --form-string "version=$v" `
          --form-string "platform=windows-x86_64" `
          --form-string "notes=Mise à jour VEXT v$v" `
          --form-string "signature=$sig" `
          -F "file=@$($exe.FullName)"
        if ($LASTEXITCODE -ne 0) { Write-Error "Échec de la publication sur le VPS"; exit 1 }

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: 'VEXT ${{ github.ref_name }}'
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          apps/frontend/src-tauri/target/release/bundle/nsis/*.exe
          apps/frontend/src-tauri/target/release/bundle/nsis/*.exe.sig
          apps/frontend/src-tauri/target/release/bundle/nsis/*.zip
          apps/frontend/src-tauri/target/release/bundle/nsis/*.zip.sig
          apps/frontend/src-tauri/target/release/bundle/msi/*.msi
          apps/frontend/src-tauri/target/release/bundle/msi/*.msi.sig
          apps/frontend/src-tauri/target/release/latest.json
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
