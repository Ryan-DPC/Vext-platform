services:
  vext-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: vext-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - WS_URL=http://vext-backend:3001
      - BACKEND_URL=https://hoopslive.ch/vext
      - STORAGE_PATH=/app/storage
      - STORAGE_PUBLIC_URL=https://hoopslive.ch/vext/storage
      - SMTP_HOST=mail.infomaniak.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=noreply@hoopslive.ch
      - SMTP_PASS=${SMTP_PASS}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - UPDATE_PUBLISH_TOKEN=${UPDATE_PUBLISH_TOKEN}
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - SMTP_FROM=VEXT <noreply@hoopslive.ch>
    volumes:
      - /opt/vext/storage:/app/storage
    networks:
      - db-network
      - hoopslive-slim_hoopslive-slim

  # Serveur WebSocket temps réel (chat, présence des amis, groupes, lobbies).
  # Caddy lui route les connexions Upgrade sur /vext (voir docs/DEPLOY.md).
  vext-ws:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: vext-ws
    restart: unless-stopped
    environment:
      - PORT=3002
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - db-network
      - hoopslive-slim_hoopslive-slim

networks:
  db-network:
    external: true
  hoopslive-slim_hoopslive-slim:
    external: true
