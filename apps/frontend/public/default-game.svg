<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20172e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0b17;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="petalPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9ebc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5e91;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="petalCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81fdff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48bbdb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="petalPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Card -->
  <rect width="400" height="600" fill="url(#cardBg)" />
  
  <!-- Subtle Geometry -->
  <circle cx="200" cy="270" r="140" fill="none" stroke="#ff7eb3" stroke-width="1.5" opacity="0.1" />
  <circle cx="200" cy="270" r="110" fill="none" stroke="#7afcff" stroke-width="1" opacity="0.08" />
  
  <!-- Origami V Icon -->
  <g transform="translate(140, 200) scale(0.47)">
    <polygon points="128,40 50,150 128,190" fill="url(#petalCyan)" opacity="0.9" />
    <polygon points="128,40 206,150 128,190" fill="url(#petalPink)" opacity="0.95" />
    <polygon points="50,150 128,190 128,230" fill="url(#petalPurple)" opacity="0.8" />
    <polygon points="206,150 128,190 128,230" fill="url(#petalPurple)" opacity="0.8" />
  </g>
  
  <!-- Typography -->
  <text x="200" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">VEXT</text>
  <text x="200" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#a092b5" text-anchor="middle" letter-spacing="2">GAME TITLE</text>
</svg>
